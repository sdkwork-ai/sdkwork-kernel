  /internal/v3/api/intelligence/runtime/sessions/{sessionId}/model/stream:
    post:
      tags: [intelligence]
      summary: Stream a model response via SSE
      description: |
        Returns a Server-Sent Events stream of model output chunks for
        real-time token-by-token display in chat UIs. Each SSE event has
        type `model.chunk` with a JSON payload containing `modelRequestId`,
        `sequence`, `content`, and `finishReason`. The stream terminates
        with a `model.done` event.
      operationId: runtime.sessions.model.stream
      x-sdkwork-wire-protocol: external
      x-sdkwork-external-protocol-id: server-sent-events
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
