components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Application ingress token. Runtime also accepts Authorization Bearer and x-sdkwork-access-token.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT ingress when SDKWORK_KERNEL_INGRESS_AUTH_MODE=jwt (HS256, RS256, or JWKS-backed keys).
  parameters:
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    ToolNamePath:
      name: toolName
      in: path
      required: true
      schema:
        type: string
    PermissionRequestIdPath:
      name: permissionRequestId
      in: path
      required: true
      schema:
        type: string
    SdkworkTenantIdHeader:
      name: x-sdkwork-tenant-id
      in: header
      required: false
      schema:
        type: string
      description: Caller tenant identity for session ownership in token ingress mode.
    SdkworkUserIdHeader:
      name: x-sdkwork-user-id
      in: header
      required: false
      schema:
        type: string
      description: Caller user identity for session ownership in token ingress mode.
    SdkworkIdentityMacHeader:
      name: x-sdkwork-identity-mac
      in: header
      required: false
      schema:
        type: string
    RunIdPath:
      name: runId
      in: path
      required: true
      schema:
        type: string
      description: HMAC-SHA256 hex proof over "{tenantId}\n{userId}" keyed by the ingress token; required for non-loopback signed identity mode.
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated retry key. It is scoped by the authenticated tenant, principal, HTTP method, and route. Reusing it with a different request body returns 40901.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[A-Za-z0-9._:/-]+$'
    LastEventIdQuery:
      name: lastEventId
      in: query
      required: false
      schema:
        type: string
    LiveQuery:
      name: live
      in: query
      required: false
      schema:
        type: boolean
    Page:
      name: page
      in: query
      required: false
      description: One-based page index for offset pagination. Default 1.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Page size for list pagination. Default 20, maximum 200.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor for high-volume lists. Mutually exclusive with `page`.
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem detail response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    ProblemDetail:
      type: object
      additionalProperties: true
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: Request endpoint occurrence in the form `{METHOD} {routeTemplate}`.
        operationId:
          type: string
        code:
          type: integer
          format: int32
          description: Numeric error result code. MUST be non-zero. See API_SPEC.md §15.3.
          minimum: 40001
          maximum: 79999
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id.
        errorCategory:
          type: string
        retryable:
          type: boolean
    SdkWorkApiResponse:
      type: object
      additionalProperties: false
      required: [code, data, traceId]
      properties:
        code:
          type: integer
          format: int32
          description: Numeric success result code. MUST be 0 on HTTP 2xx JSON bodies.
          enum: [0]
          default: 0
          minimum: 0
          maximum: 0
        data:
          description: Operation-specific payload.
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id.
    SdkWorkPageData:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items: {}
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    SdkWorkResourceData:
      type: object
      additionalProperties: false
      required: [item]
      properties:
        item:
          description: Typed domain resource for the operation.
    PageInfo:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [offset, cursor]
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        totalItems:
          type: string
          pattern: '^[0-9]+$'
        totalPages:
          type: integer
          minimum: 0
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
    RuntimeManifest:
      type: object
      required: [runtimeId, agentId, kernelVersion, securityProfile, capabilities, providers, missingRequiredCapabilities, degradedCapabilities]
      properties:
        runtimeId:
          type: string
        agentId:
          type: string
        kernelVersion:
          type: string
        securityProfile:
          type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderManifest'
        missingRequiredCapabilities:
          type: array
          items:
            type: string
        degradedCapabilities:
          type: array
          items:
            type: string
    Capability:
      type: object
      required: [capabilityId, providerId, status, required]
      properties:
        capabilityId:
          type: string
        providerId:
          type: string
        status:
          type: string
        required:
          type: boolean
    ProviderManifest:
      type: object
      required: [providerId, providerFamily, name, version, capabilities]
      properties:
        providerId:
          type: string
        providerFamily:
          type: string
        name:
          type: string
        version:
          type: string
        capabilities:
          type: array
          items:
            type: string
        healthStatus:
          type: string
          nullable: true
    RuntimeHealth:
      type: object
      required: [runtimeId, state, health, persistenceHealthy, degradedCapabilities]
      properties:
        runtimeId:
          type: string
        state:
          type: string
        health:
          type: string
          enum: [healthy, degraded]
        persistenceHealthy:
          type: boolean
        degradedCapabilities:
          type: array
          items:
            type: string
    RuntimeDiagnostics:
      type: object
      required: [runtimeId, agentId, state, providerCount, capabilityCount, typedProviderCount, manifestOnlyProviderCount, missingRequiredCapabilities, degradedCapabilities, providerDiagnostics]
      properties:
        runtimeId:
          type: string
        agentId:
          type: string
        state:
          type: string
        providerCount:
          type: integer
        capabilityCount:
          type: integer
        typedProviderCount:
          type: integer
        manifestOnlyProviderCount:
          type: integer
        missingRequiredCapabilities:
          type: array
          items:
            type: string
        degradedCapabilities:
          type: array
          items:
            type: string
        providerDiagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ProviderDiagnostic'
    ProviderDiagnostic:
      type: object
      required: [providerId, providerFamily, providerVersion, typedRegistered, capabilities]
      properties:
        providerId:
          type: string
        providerFamily:
          type: string
        providerVersion:
          type: string
        typedRegistered:
          type: boolean
        healthStatus:
          type: string
          nullable: true
        capabilities:
          type: array
          items:
            type: string
    RuntimeSnapshot:
      type: object
      required: [runtime, events, permissions, patches, verificationReports, terminalCommands, terminalOutput, reviewFindings]
      description: >-
        Kernel runtime aggregate snapshot.  is null because the
        kernel runtime owns no workspace surface; the product layer
        (agents/BirdCoder) projects its own workspace snapshot when mounted.
        Patch/verification/terminal/review projections are kernel-absent and
        reported empty.
      properties:
        runtime:
          $ref: '#/components/schemas/KernelRuntime'
        events:
          type: array
          items:
            $ref: '#/components/schemas/KernelEvent'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionRequest'
        workspace:
          nullable: true
          $ref: '#/components/schemas/Workspace'
        patches:
          type: array
          items:
            $ref: '#/components/schemas/PatchSet'
        verificationReports:
          type: array
          items:
            $ref: '#/components/schemas/VerificationReport'
        terminalCommands:
          type: array
          items:
            $ref: '#/components/schemas/TerminalCommand'
        terminalOutput:
          type: array
          items:
            $ref: '#/components/schemas/TerminalOutputChunk'
        reviewFindings:
          type: array
          items:
            $ref: '#/components/schemas/ReviewFinding'
    KernelRuntime:
      type: object
      required: [runtimeId, agentId, kernelVersion, state, health, capabilities, missingRequiredCapabilities, degradedCapabilities]
      properties:
        runtimeId:
          type: string
        agentId:
          type: string
        kernelVersion:
          type: string
        state:
          type: string
        health:
          type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        missingRequiredCapabilities:
          type: array
          items:
            type: string
        degradedCapabilities:
          type: array
          items:
            type: string
    KernelEvent:
      type: object
      required: [eventId, eventType, severity, summary, sequence]
      properties:
        eventId:
          type: string
        eventType:
          type: string
        severity:
          type: string
        summary:
          type: string
        sequence:
          type: integer
          format: int32
        traceId:
          type: string
          nullable: true
    Workspace:
      type: object
      required: [workspaceId, root, branch, dirty, changedFiles]
      properties:
        workspaceId:
          type: string
        root:
          type: string
        branch:
          type: string
        dirty:
          type: boolean
        changedFiles:
          type: array
          items:
            type: string
    PermissionDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [allow, deny]
    PermissionRequest:
      type: object
      required: [permissionRequestId, category, resource, sideEffectLevel, reason, status]
      properties:
        permissionRequestId:
          type: string
        category:
          type: string
        resource:
          type: string
        sideEffectLevel:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [pending, allow, deny, needs_approval]
    PatchSet:
      type: object
      required: [patchId, workspaceId, summary, operations]
      properties:
        patchId:
          type: string
        workspaceId:
          type: string
        summary:
          type: string
        operations:
          type: array
          items:
            $ref: '#/components/schemas/PatchOperation'
    PatchOperation:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [createFile, updateFile, deleteFile]
        path:
          type: string
        content:
          type: string
          nullable: true
        before:
          type: string
          nullable: true
        after:
          type: string
          nullable: true
    VerificationReport:
      type: object
      required: [reportId, verificationId, commandResults, failures]
      properties:
        reportId:
          type: string
        verificationId:
          type: string
        commandResults:
          type: array
          items:
            $ref: '#/components/schemas/CommandResult'
        failures:
          type: array
          items:
            type: string
    CommandResult:
      type: object
      required: [commandId, stdout, stderr, cancelled, timedOut]
      properties:
        commandId:
          type: string
        exitCode:
          type: integer
          format: int32
          nullable: true
        stdout:
          type: string
        stderr:
          type: string
        cancelled:
          type: boolean
        timedOut:
          type: boolean
    TerminalCommand:
      type: object
      required: [commandId, command, args, workingDirectory]
      properties:
        commandId:
          type: string
        command:
          type: string
        args:
          type: array
          items:
            type: string
        workingDirectory:
          type: string
        timeoutMs:
          type: string
          format: int64
          pattern: '^-?[0-9]+$'
          x-sdkwork-int64-string: true
          nullable: true
        policyCategories:
          type: array
          items:
            type: string
    TerminalOutputChunk:
      type: object
      required: [commandId, sequence, channel, content]
      properties:
        commandId:
          type: string
        sequence:
          type: string
          format: int64
          pattern: '^-?[0-9]+$'
          x-sdkwork-int64-string: true
        channel:
          type: string
          enum: [stdout, stderr, system]
        content:
          type: string
        redactionClassification:
          type: string
          nullable: true
    ReviewFinding:
      type: object
      required: [findingId, severity, filePath, message]
      properties:
        findingId:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        filePath:
          type: string
        line:
          type: integer
          format: int32
          nullable: true
        message:
          type: string
        remediation:
          type: string
          nullable: true
        missingTest:
          type: string
          nullable: true
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [agentId]
      properties:
        agentId:
          type: string
          minLength: 1
          maxLength: 256
        tenantId:
          type: string
        userRef:
          type: string
        model:
          type: string
          minLength: 1
          maxLength: 256
        modelProvider:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 1024
        goal:
          type: string
          minLength: 1
          maxLength: 262144
        instructions:
          type: string
          minLength: 1
          maxLength: 262144
        cwd:
          type: string
          minLength: 1
          maxLength: 4096
        workspaceRoots:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 4096
        source:
          type: string
        kind:
          type: string
        timeoutMs:
          type: integer
          minimum: 0
          description: Session timeout in milliseconds.
        metadata:
          type: object
          maxProperties: 64
          additionalProperties:
            type: string
            maxLength: 4096
    SessionResponse:
      type: object
      required: [sessionId, source, kind, agentId, state, workspaceRoots, tokenUsage, messageCount, toolCallCount, compressionCount, changeSummary, childSessionIds, metadata]
      properties:
        sessionId:
          type: string
        source:
          type: string
        kind:
          type: string
        agentId:
          type: string
        userRef:
          type: string
          nullable: true
        tenantId:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        goal:
          type: string
          nullable: true
        state:
          type: string
        createdAt:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        modelProvider:
          type: string
          nullable: true
        cwd:
          type: string
          nullable: true
        workspaceRoots:
          type: array
          items:
            type: string
        instructions:
          type: string
          nullable: true
        tokenUsage:
          $ref: '#/components/schemas/TokenUsage'
        messageCount:
          type: integer
        toolCallCount:
          type: integer
        compressionCount:
          type: integer
        changeSummary:
          $ref: '#/components/schemas/ChangeSummary'
        childSessionIds:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    TokenUsage:
      type: object
      required: [inputTokens, outputTokens, cachedTokens, reasoningTokens, totalTokens]
      properties:
        inputTokens:
          type: integer
          format: uint64
        outputTokens:
          type: integer
          format: uint64
        cachedTokens:
          type: integer
          format: uint64
        reasoningTokens:
          type: integer
          format: uint64
        totalTokens:
          type: integer
          format: uint64
    ChangeSummary:
      type: object
      required: [additions, deletions, filesChanged]
      properties:
        additions:
          type: integer
        deletions:
          type: integer
        filesChanged:
          type: integer
    SessionListResponse:
      description: Paginated runtime session list following SdkWorkApiResponse envelope.
      allOf:
        - $ref: '#/components/schemas/SdkWorkApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/SdkWorkPageData'
                - type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/SessionResponse'
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 262144
    MessageResponse:
      type: object
      required: [messageId, sessionId, role, parts]
      properties:
        messageId:
          type: string
        sessionId:
          type: string
        role:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/MessagePart'
        createdAt:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
    MessagePart:
      type: object
      required: [partId, kind, content]
      properties:
        partId:
          type: string
        kind:
          type: string
        content:
          type: string
          maxLength: 262144
    MessageTurnResponse:
      type: object
      additionalProperties: false
      required: [userMessage, status]
      properties:
        userMessage:
          $ref: '#/components/schemas/MessageResponse'
        assistantMessage:
          allOf:
            - $ref: '#/components/schemas/MessageResponse'
          nullable: true
        status:
          type: string
          enum: [completed]
    MessageListResponse:
      description: Paginated session message list following SdkWorkApiResponse envelope.
      allOf:
        - $ref: '#/components/schemas/SdkWorkApiResponse'
        - type: object
          required: [data]
          properties:
