[package]
rust-version.workspace = true
name = "sdkwork-agent-kernel"
version = "0.1.0"
edition = "2021"


[lints]
workspace = true
[lib]
name = "sdkwork_agent_kernel"
path = "src/lib.rs"

[features]
default = []
sdkwork-models = ["dep:sdkwork-models"]
secret-vault = ["dep:ureq"]

[dependencies]
async-trait.workspace = true
sdkwork-utils-rust.workspace = true
sdkwork-intelligence-sandbox-service.workspace = true
sdkwork-sandbox-provider-spi.workspace = true
sdkwork-models = { workspace = true, optional = true }
serde_json = "1"
ureq = { version = "2.12", optional = true, default-features = false, features = ["json", "tls"] }

[dev-dependencies]
async-trait.workspace = true
sdkwork-agent-provider-core.workspace = true
tokio.workspace = true
