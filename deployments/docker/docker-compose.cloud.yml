# Cloud deployment handoff for sdkwork-agent-server.
#
# This file intentionally contains only the stateless runtime. It is suitable
# for a single-instance smoke or pilot deployment when the database and cache
# are supplied by external managed services. It is not an HA production
# orchestrator: production scale-out uses the Kubernetes (or equivalent)
# deployment with managed HA PostgreSQL and Redis.
#
# All values that can contain credentials are required at deploy time. Do not
# add defaults, checked-in passwords, or embedded database/cache services here.

# Shared log rotation policy (OPERATIONS_SPEC.md §2.3): every service rotates
# at 10MB, keeping 3 files, so container logs cannot fill the host disk.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  agent-server:
    image: ${SDKWORK_AGENT_SERVER_IMAGE:?set an immutable agent-server image reference}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "18280:18280"
    env_file:
      - ../../etc/topology/cloud.production.env
    environment:
      SDKWORK_KERNEL_INGRESS_TOKEN: ${SDKWORK_KERNEL_INGRESS_TOKEN:?set SDKWORK_KERNEL_INGRESS_TOKEN}
      SDKWORK_KERNEL_METRICS_TOKEN: ${SDKWORK_KERNEL_METRICS_TOKEN:?set a dedicated SDKWORK_KERNEL_METRICS_TOKEN}
      SDKWORK_CURSOR_SIGNING_SECRET: ${SDKWORK_CURSOR_SIGNING_SECRET:?set a dedicated SDKWORK_CURSOR_SIGNING_SECRET with at least 32 bytes}
      SDKWORK_APPROVAL_PAYLOAD_ENCRYPTION_KEY: ${SDKWORK_APPROVAL_PAYLOAD_ENCRYPTION_KEY:?set a dedicated base64url-encoded 32-byte approval payload key}
      SDKWORK_CORS_ORIGINS: ${SDKWORK_CORS_ORIGINS:?set an explicit SDKWORK_CORS_ORIGINS allowlist}
      SDKWORK_DATABASE_ENGINE: postgresql
      SDKWORK_DATABASE_URL: ${SDKWORK_DATABASE_URL:?set the managed workspace PostgreSQL URL}
      SDKWORK_RATE_LIMIT_REDIS_URL: ${SDKWORK_RATE_LIMIT_REDIS_URL:?set the managed Redis rate-limit URL}
      SDKWORK_OTEL_EXPORTER_OTLP_ENDPOINT: ${SDKWORK_OTEL_EXPORTER_OTLP_ENDPOINT:-}
    read_only: true
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
      - /var/lib/sdkwork:rw,nosuid,nodev,size=256m
    logging: *default-logging
