# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/kernel/webserver.pid;
error_log /var/log/sdkwork/kernel/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name kernel-staging.sdkwork.com kernel-staging.birdcoder.com kernel-staging.dtupay.com kernel-staging.noaper.com kernel-staging.sdkwork.cn kernel-staging.birdcoder.cn kernel-staging.dtupay.cn kernel-staging.noaper.cn kernel-staging.skubc.com kernel-staging.skubc.cn kernel-staging.zowalk.com kernel-staging.zowalk.cn kernel-staging.offer86.com kernel-staging.offer86.cn kernel-staging.86offer.com kernel-staging.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/kernel/web/static;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
