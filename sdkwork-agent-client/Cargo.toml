[package]
rust-version.workspace = true
name = "sdkwork-agent-client"
version = "0.1.0"
edition = "2021"
description = "Typed HTTP and SSE client for the SDKWork agent internal API"


[lints]
workspace = true
[dependencies]
sdkwork-agent-kernel.workspace = true
sdkwork-agent-provider-claude-code.workspace = true
sdkwork-agent-provider-codex.workspace = true
sdkwork-agent-provider-gemini-cli.workspace = true
sdkwork-agent-provider-openclaw.workspace = true
sdkwork-agent-provider-opencode.workspace = true
sdkwork-agent-provider-hermes.workspace = true
sdkwork-agent-provider-spi.workspace = true
sdkwork-agent-database = { workspace = true, features = ["sqlite"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
hmac = "0.12"
sha2 = "0.10"

# HTTP/SSE
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
