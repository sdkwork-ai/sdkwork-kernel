[package]
rust-version.workspace = true
name = "sdkwork-agent-server"
version = "0.1.0"
edition = "2021"
description = "SDKWork Agent Server - runnable server binary with config, preflight, health checks"

[[bin]]
name = "sdkwork-agent-server"
path = "src/main.rs"


[lints]
workspace = true
[features]
default = ["observability-otel"]
observability-otel = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]
# Codex agent provider carries its own embedded SQLite runtime store
# (codex-state). It is an optional, per-application integration: off by
# default so server/container builds stay SQLite-free (DATABASE_SPEC:
# authoritative-server persistence is PostgreSQL only); applications that
# need the Codex engine enable it explicitly, and client-local surfaces
# enable it for device-scoped state.
codex-provider = ["dep:sdkwork-agent-provider-codex"]

[dependencies]
sdkwork-agent-kernel.workspace = true
sdkwork-code-kernel.workspace = true
sdkwork-agent-api-bridge.workspace = true
sdkwork-agent-database = { workspace = true, features = ["postgres-sync"] }
sdkwork-database-config.workspace = true
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
sdkwork-agent-session.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "limit", "timeout"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-client"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
subtle = "2"
aes-gcm = "0.10"
jsonwebtoken = "9"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
uuid = { version = "1", features = ["v7"] }
sdkwork-agent-plugin-core.workspace = true
sdkwork-utils-rust = { workspace = true }
sdkwork-web-bootstrap.workspace = true
sdkwork-web-axum.workspace = true
sdkwork-web-core.workspace = true
sdkwork-web-store-redis.workspace = true
sdkwork-agent-provider-rig.workspace = true
sdkwork-agent-provider-openclaw.workspace = true
sdkwork-agent-provider-hermes.workspace = true
sdkwork-agent-provider-mimo-code.workspace = true
sdkwork-agent-provider-codex = { workspace = true, optional = true }
sdkwork-agent-provider-claude-code.workspace = true
sdkwork-agent-provider-opencode.workspace = true
sdkwork-agent-provider-gemini-cli.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
jsonwebtoken = "9"
chrono = "0.4"
tempfile = "3"
