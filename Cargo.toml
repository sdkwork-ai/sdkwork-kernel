[workspace]
resolver = "2"
members = [
    "crates/sdkwork-api-kernel-standalone-gateway",
    "crates/sdkwork-api-kernel-assembly",
    "sdkwork-agent-kernel",
    "sdkwork-agent-provider-spi",
    "sdkwork-agent-provider-transport-core",
    "sdkwork-agent-provider-transport-ipc",
    "sdkwork-agent-provider-transport-rust",
    "sdkwork-agent-provider-transport-node",
    "sdkwork-agent-provider-transport-python",
    "sdkwork-code-kernel",
    "sdkwork-agent-api-bridge",
    "sdkwork-agent-server",
    "sdkwork-agent-database",
    "sdkwork-agent-session",
    "sdkwork-agent-client",
    "crates/sdkwork-routes-agent-internal-manifest",
    "crates/sdkwork-routes-agent-internal-api",
    "sdkwork-kernel-plugins/crates/sdkwork-agent-plugin-core",
    "sdkwork-kernel-plugins/crates/sdkwork-kernel-plugin-drive",
    "sdkwork-kernel-plugins/crates/sdkwork-kernel-plugin-knowledgebase",
    "sdkwork-kernel-plugins/crates/sdkwork-agent-provider-core",
    "agent-providers/crates/sdkwork-agent-provider-codex",
    "agent-providers/crates/sdkwork-agent-provider-claude-code",
    "agent-providers/crates/sdkwork-agent-provider-gemini-cli",
    "agent-providers/crates/sdkwork-agent-provider-opencode",
    "agent-providers/crates/sdkwork-agent-provider-openclaw",
    "agent-providers/crates/sdkwork-agent-provider-hermes",
    "agent-providers/crates/sdkwork-agent-provider-mimo-code",
    "agent-providers/crates/sdkwork-agent-provider-rig",
]
exclude = ["external/codex/codex-rs"]

[workspace.package]
rust-version = "1.85"
edition = "2021"
version = "0.1.0"

[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline.
# Deny-tier lints (unsafe_code, panic, unwrap_used, expect_used, pedantic) are
# promoted per crate together with their cleanup: enabling them fleet-wide
# today floods or fails builds that have not paid that debt yet.
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"

[workspace.dependencies]
async-trait = "0.1"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync"] }
# 0.39.0 is the newest rusqlite release using libsqlite3-sys 0.37, which is
# required by the pinned Codex source dependency. Newer rusqlite releases use a
# different `links = "sqlite3"` provider and cannot coexist in one Cargo graph.
rusqlite = { version = "0.39.0", features = ["bundled"] }
time = { version = "0.3.47", features = ["formatting"] }
codex-app-server-client = { path = "external/codex/codex-rs/app-server-client" }
codex-app-server-protocol = { path = "external/codex/codex-rs/app-server-protocol" }
codex-core = { path = "external/codex/codex-rs/core" }
sdkwork-api-kernel-assembly = { path = "crates/sdkwork-api-kernel-assembly" }
# SDKWork workspace members - declared once at workspace root
sdkwork-agent-kernel = { path = "sdkwork-agent-kernel" }
sdkwork-agent-provider-spi = { path = "sdkwork-agent-provider-spi" }
sdkwork-agent-provider-transport-core = { path = "sdkwork-agent-provider-transport-core" }
sdkwork-agent-provider-transport-ipc = { path = "sdkwork-agent-provider-transport-ipc" }
sdkwork-agent-provider-transport-rust = { path = "sdkwork-agent-provider-transport-rust" }
sdkwork-agent-provider-transport-node = { path = "sdkwork-agent-provider-transport-node" }
sdkwork-agent-provider-transport-python = { path = "sdkwork-agent-provider-transport-python" }
sdkwork-code-kernel = { path = "sdkwork-code-kernel" }
sdkwork-agent-api-bridge = { path = "sdkwork-agent-api-bridge" }
sdkwork-agent-server = { path = "sdkwork-agent-server" }
sdkwork-agent-database = { path = "sdkwork-agent-database" }
sdkwork-agent-session = { path = "sdkwork-agent-session" }
sdkwork-agent-client = { path = "sdkwork-agent-client" }
sdkwork-agent-plugin-core = { path = "sdkwork-kernel-plugins/crates/sdkwork-agent-plugin-core" }
sdkwork-kernel-plugin-drive = { path = "sdkwork-kernel-plugins/crates/sdkwork-kernel-plugin-drive" }
sdkwork-kernel-plugin-knowledgebase = { path = "sdkwork-kernel-plugins/crates/sdkwork-kernel-plugin-knowledgebase" }
sdkwork-agent-provider-core = { path = "sdkwork-kernel-plugins/crates/sdkwork-agent-provider-core" }
sdkwork-agent-provider-codex = { path = "agent-providers/crates/sdkwork-agent-provider-codex" }
sdkwork-agent-provider-claude-code = { path = "agent-providers/crates/sdkwork-agent-provider-claude-code" }
sdkwork-agent-provider-gemini-cli = { path = "agent-providers/crates/sdkwork-agent-provider-gemini-cli" }
sdkwork-agent-provider-opencode = { path = "agent-providers/crates/sdkwork-agent-provider-opencode" }
sdkwork-agent-provider-openclaw = { path = "agent-providers/crates/sdkwork-agent-provider-openclaw" }
sdkwork-agent-provider-hermes = { path = "agent-providers/crates/sdkwork-agent-provider-hermes" }
sdkwork-agent-provider-mimo-code = { path = "agent-providers/crates/sdkwork-agent-provider-mimo-code" }
sdkwork-agent-provider-rig = { path = "agent-providers/crates/sdkwork-agent-provider-rig" }
sdkwork-drive-storage-contract = { path = "../sdkwork-drive/crates/sdkwork-drive-storage-contract" }
sdkwork-knowledgebase-contract = { path = "../sdkwork-knowledgebase/crates/sdkwork-knowledgebase-contract" }
sdkwork-skills-contract = { path = "../sdkwork-skills/crates/sdkwork-skills-contract" }
sdkwork-intelligence-sandbox-service = { path = "../sdkwork-sandbox/crates/sdkwork-intelligence-sandbox-service" }
sdkwork-sandbox-provider-spi = { path = "../sdkwork-sandbox/crates/sdkwork-sandbox-provider-spi" }

# Platform frameworks — declared for phased adoption per ADR-20260618-platform-framework-adoption.md
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-web-contract = { path = "../sdkwork-web-framework/crates/sdkwork-web-contract" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-web-store-redis = { path = "../sdkwork-web-framework/crates/sdkwork-web-store-redis" }
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
sdkwork-models = { path = "../sdkwork-models/sdks/sdkwork-models-sdk/sdkwork-models-sdk-rust" }
sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }
sdkwork-routes-agent-internal-manifest = { path = "crates/sdkwork-routes-agent-internal-manifest" }
sdkwork-routes-agent-internal-api = { path = "crates/sdkwork-routes-agent-internal-api" }

[patch.crates-io]
# Keep the embedded Codex graph aligned with the upstream workspace patches.
# The forked websocket crates provide the `proxy` support required by Codex.
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
