[package]
rust-version.workspace = true
name = "sdkwork-agent-database"
version = "0.1.0"
edition = "2021"
description = "Database abstraction layer for SDKWork agent session persistence"


[lints]
workspace = true
[features]
default = []
sqlite = ["dep:rusqlite"]
postgres-sync = [
    "dep:sdkwork-database-config",
    "dep:sdkwork-database-sqlx",
    "dep:sqlx",
    "dep:tokio",
]

[dependencies]
sdkwork-agent-kernel.workspace = true
sdkwork-utils-rust = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
sdkwork-database-config = { workspace = true, optional = true }
sdkwork-database-sqlx = { workspace = true, optional = true }
# sqlx 0.9 aligns with the sdkwork-database migration unified with the kernel
# Codex graph (see ../sdkwork-database/Cargo.toml); the sibling
# sdkwork-database-sqlx crate consumes it through the workspace declaration.
sqlx = { version = "0.9", default-features = false, optional = true, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.0", optional = true, features = ["rt-multi-thread", "macros"] }

# SQLite
rusqlite = { workspace = true, optional = true }

[[test]]
name = "agent_runtime_postgres_contracts"
path = "tests/agent_runtime_postgres_contracts.rs"
required-features = ["postgres-sync"]
