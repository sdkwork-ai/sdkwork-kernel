name: Kernel verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-remediation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout sdkwork-app-topology sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-app-topology
          path: .workspace-deps/sdkwork-app-topology
          ref: main

      - name: Checkout sdkwork-database sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-database
          path: .workspace-deps/sdkwork-database
          ref: main

      - name: Checkout sdkwork-utils sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-utils
          path: .workspace-deps/sdkwork-utils
          ref: main

      - name: Checkout sdkwork-web-framework sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-web-framework
          path: .workspace-deps/sdkwork-web-framework
          ref: main

      - name: Checkout sdkwork-drive sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-drive
          path: .workspace-deps/sdkwork-drive
          ref: main

      - name: Checkout sdkwork-knowledgebase sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-knowledgebase
          path: .workspace-deps/sdkwork-knowledgebase
          ref: main

      - name: Checkout sdkwork-iam sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-iam
          path: .workspace-deps/sdkwork-iam
          ref: main

      - name: Checkout sdkwork-id sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-id
          path: .workspace-deps/sdkwork-id
          ref: main

      - name: Checkout sdkwork-prompts sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-prompts
          path: .workspace-deps/sdkwork-prompts
          ref: main

      - name: Checkout sdkwork-specs sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-specs
          path: .workspace-deps/sdkwork-specs
          ref: main

      - name: Checkout sdkwork-birdcoder sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-birdcoder
          path: .workspace-deps/sdkwork-birdcoder
          ref: main

      - name: Link platform siblings for path dependencies
        run: |
          mkdir -p ..
          for repo in \
            sdkwork-app-topology \
            sdkwork-database \
            sdkwork-utils \
            sdkwork-web-framework \
            sdkwork-drive \
            sdkwork-knowledgebase \
            sdkwork-iam \
            sdkwork-id \
            sdkwork-prompts \
            sdkwork-specs \
            sdkwork-birdcoder
          do
            ln -sfn "$GITHUB_WORKSPACE/.workspace-deps/$repo" "../$repo"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - uses: dtolnay/rust-toolchain@stable

      - name: Install workspace topology dependency
        run: pnpm install --ignore-scripts

      - name: Build sdkwork-utils TypeScript package
        run: |
          pnpm --dir ../sdkwork-utils/packages/sdkwork-utils-typescript install
          pnpm --dir ../sdkwork-utils/packages/sdkwork-utils-typescript build

      - name: Run kernel audit verification
        run: node scripts/verify-kernel-audit-remediation.mjs

  postgres-live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sdkwork_ai_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sdkwork_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdkwork_ai_test -d sdkwork_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Checkout sdkwork-database sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-database
          path: .workspace-deps/sdkwork-database
          ref: main

      - name: Checkout sdkwork-utils sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-utils
          path: .workspace-deps/sdkwork-utils
          ref: main

      - name: Checkout sdkwork-web-framework sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-web-framework
          path: .workspace-deps/sdkwork-web-framework
          ref: main

      - name: Checkout sdkwork-drive sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-drive
          path: .workspace-deps/sdkwork-drive
          ref: main

      - name: Checkout sdkwork-knowledgebase sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-knowledgebase
          path: .workspace-deps/sdkwork-knowledgebase
          ref: main

      - name: Checkout sdkwork-iam sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-iam
          path: .workspace-deps/sdkwork-iam
          ref: main

      - name: Checkout sdkwork-id sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-id
          path: .workspace-deps/sdkwork-id
          ref: main

      - name: Checkout sdkwork-prompts sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sdkwork-prompts
          path: .workspace-deps/sdkwork-prompts
          ref: main

      - name: Link platform siblings for path dependencies
        run: |
          mkdir -p ..
          for repo in \
            sdkwork-database \
            sdkwork-utils \
            sdkwork-web-framework \
            sdkwork-drive \
            sdkwork-knowledgebase \
            sdkwork-iam \
            sdkwork-id \
            sdkwork-prompts
          do
            ln -sfn "$GITHUB_WORKSPACE/.workspace-deps/$repo" "../$repo"
          done

      - uses: dtolnay/rust-toolchain@stable

      - name: Run live PostgreSQL runtime contracts
        env:
          SDKWORK_DATABASE_URL: postgres://sdkwork_ai_test:postgres@localhost:5432/sdkwork_ai_test
        run: >
          cargo test --features postgres-sync
          --test agent_runtime_postgres_contracts
          --manifest-path sdkwork-agent-database/Cargo.toml
          -- --include-ignored --nocapture

      - name: Run server HTTP contract suites (sqlite fixture feature)
        run: >
          cargo test --features sqlite
          --manifest-path sdkwork-agent-server/Cargo.toml
          -q
