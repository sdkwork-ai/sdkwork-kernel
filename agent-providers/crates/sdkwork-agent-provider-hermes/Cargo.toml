[package]
rust-version.workspace = true
name = "sdkwork-agent-provider-hermes"
version = "0.2.0"
edition = "2021"
description = "Hermes agent provider integration for SDKWork Agent Kernel"


[lints]
workspace = true
[lib]
name = "sdkwork_agent_provider_hermes"
path = "src/lib.rs"

[dependencies]
sdkwork-agent-kernel.workspace = true
sdkwork-agent-plugin-core.workspace = true
sdkwork-agent-provider-core.workspace = true
sdkwork-agent-provider-spi.workspace = true
sdkwork-agent-provider-transport-core.workspace = true
sdkwork-agent-provider-transport-python.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
sdkwork-agent-plugin-core = { workspace = true, features = ["test-utils"] }
